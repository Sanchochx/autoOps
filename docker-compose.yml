# AutoOps orchestration. All configuration comes from .env (see .env.example);
# required variables fail with a clear message if they are not defined.
#
#   docker compose up -d --build        # brings up the full stack
#   IMAGE_REPOSITORY=ghcr.io/<owner>/autoops IMAGE_TAG=<sha> docker compose pull   # run a published commit (no build)
#   docker compose --profile tools run --rm migrate   # Alembic migrations (explicit step)
#
# Networks (all bridge):
#   backend_net   api-gateway <-> postgres            (internal: no Internet or host access)
#   mcp_net       api-gateway <-> MCP servers      (internal: no Internet or host access)
#   edge_net      traefik (the only service publishing a host port) <-> frontend, api-gateway;
#                 Internet egress (LLM APIs for the gateway, ACME for traefik)

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    # postgres starts as root and drops to `postgres`: it needs these capabilities.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend_net]

  mcp-logs:
    image: ${IMAGE_REPOSITORY:-autoops}/mcp-logs:${IMAGE_TAG:-dev}
    build:
      context: ./services/mcp-servers/logs_server
    restart: unless-stopped
    <<: *hardening
    read_only: true
    environment:
      MCP_LOGS_HOST: 0.0.0.0
      MCP_LOGS_PORT: ${MCP_LOGS_PORT:?set MCP_LOGS_PORT in .env}
    expose: ["${MCP_LOGS_PORT}"]   # only visible in mcp_net; no `ports:`
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['MCP_LOGS_PORT'])), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [mcp_net]

  api-gateway:
    image: ${IMAGE_REPOSITORY:-autoops}/api-gateway:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/api_gateway/Dockerfile
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    environment: &gateway_env
      HOST: 0.0.0.0
      PORT: ${PORT:?set PORT in .env}
      # uvicorn (--proxy-headers) trusts X-Forwarded-* only from this peer: Traefik's fixed address on
      # edge_net. request.client is then the real client, which the login rate limit keys on.
      FORWARDED_ALLOW_IPS: ${EDGE_TRAEFIK_IP:-172.30.250.2}
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # No default: the gateway refuses to start without a secret of at least 32 characters. The old
      # SECRET_KEY is no longer read; it may stay in .env until the rollout is verified (see README).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      # Single origin behind the proxy: the dashboard is served from the public URL.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_SCHEME:-http}://${DOMAIN:?set DOMAIN in .env}
      WS_BROADCAST_TIMEOUT_SECONDS: ${WS_BROADCAST_TIMEOUT_SECONDS:-2}
      # The `postgres` host is the service name on backend_net.
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      MCP_LOGS_SERVER_URL: http://mcp-logs:${MCP_LOGS_PORT}/sse
      AI_MODEL_NAME: ${AI_MODEL_NAME:?set AI_MODEL_NAME in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      # Optional: another OpenAI-compatible endpoint; empty = default OpenAI endpoint.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-logs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [edge_net, backend_net, mcp_net]

  frontend:
    image: ${IMAGE_REPOSITORY:-autoops}/frontend:${IMAGE_TAG:-dev}
    build:
      context: ./apps/frontend
      # Vite embeds the VITE_* variables at build time. Behind the proxy the dashboard and the
      # gateway share one origin, so these are paths resolved against the page origin (routes in
      # infra/traefik/dynamic/routes.yml). They override the development values of .env.
      args:
        VITE_API_BASE_URL: /
        VITE_WS_BASE_URL: /ws
        # Ticket list polling (ms, 0 disables); read from .env, default 5000.
        VITE_TICKETS_POLL_INTERVAL_MS: ${VITE_TICKETS_POLL_INTERVAL_MS:-5000}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [edge_net]

  # Reverse proxy: the only service that publishes a host port. Configuration is baked into
  # the image (infra/traefik/Dockerfile): static file + file provider; the Docker socket is NOT mounted.
  # Runs unprivileged; NET_BIND_SERVICE is kept so binding 80/443 never depends on sysctl defaults.
  traefik:
    image: ${IMAGE_REPOSITORY:-autoops}/traefik:${IMAGE_TAG:-dev}
    build:
      context: ./infra/traefik
      args:
        TRAEFIK_VERSION: ${TRAEFIK_VERSION:-v3.7.16}
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      GATEWAY_PORT: ${PORT:?set PORT in .env}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-31536000}
      TLS_MODE: ${TLS_MODE:?set TLS_MODE in .env (selfsigned | acme)}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      # Leaf certificate and key only (written by scripts/provision/65_tls.sh); the CA key is never
      # mounted. TLS_DIR defaults to ./tls, which is ${APP_DIR}/tls on the host.
      - ${TLS_DIR:-./tls}/server:/etc/traefik/tls:ro
      # Let's Encrypt account and certificates (TLS_MODE=acme); unused in selfsigned mode.
      - acme:/acme
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      edge_net:
        ipv4_address: ${EDGE_TRAEFIK_IP:-172.30.250.2}

  # Alembic migrations: explicit step, not run by `up`.
  #   docker compose --profile tools run --rm migrate
  migrate:
    image: ${IMAGE_REPOSITORY:-autoops}/api-gateway:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/api_gateway/Dockerfile
    profiles: [tools]
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    command: ["alembic", "-c", "apps/api_gateway/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend_net]

networks:
  edge_net:
    driver: bridge
    # Fixed subnet so Traefik has a known address (FORWARDED_ALLOW_IPS above). Docker hands the dynamic
    # addresses of the other services (gateway, frontend) out of ip_range ONLY, and Traefik's fixed address
    # lies outside it: otherwise whichever container starts first could take it and Traefik would fail with
    # "Address already in use". Change the three EDGE_* values together if the range collides with another
    # network on the host; scripts/ci/check_edge_net.sh verifies the resolved model.
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.250.0/24}
          ip_range: ${EDGE_IP_RANGE:-172.30.250.128/25}
  backend_net:
    driver: bridge
    internal: true
  mcp_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  acme:
