name: CI

# US-CICD-001/002. Validates code and configuration and builds the images. Only a push to main publishes them (job
# `publish`), using the built-in GITHUB_TOKEN; no other secret is involved.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# A newer push to a pull request supersedes the running one; runs on develop/main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api_gateway/requirements-dev.txt
            apps/api_gateway/requirements.txt
            services/ai-engine/requirements.txt
            services/mcp-servers/logs_server/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r apps/api_gateway/requirements-dev.txt \
                      -r services/ai-engine/requirements.txt \
                      -r services/mcp-servers/logs_server/requirements.txt
      # A clean checkout has no .env (it is git-ignored) and the job defines no secrets or LLM keys. The guard
      # on PYTHONPATH also makes any non-loopback network access fail, so isolation is enforced, not assumed.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/ci/nonet
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Same-origin values the Compose build passes as build-args (public, no secrets).
      - name: Build
        env:
          VITE_API_BASE_URL: /
          VITE_WS_BASE_URL: /ws
        run: npm run build

  # `docker compose config` resolves every ${VAR:?...} guard, so a renamed or missing variable fails here.
  # .env.example is the only environment CI ever sees; its placeholders would be rejected by validate_env.sh
  # in production, which is intended.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tls_mode: [selfsigned, acme]
        files: ["-f docker-compose.yml", "-f docker-compose.yml -f docker-compose.dev-db.yml"]
        image: [default]
        include:
          # US-CICD-002: the host consumes published images by repository and SHA tag.
          - tls_mode: selfsigned
            files: "-f docker-compose.yml"
            image: pinned
            image_repository: ghcr.io/example/autoops
            image_tag: 0123456789abcdef0123456789abcdef01234567
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: Validate the Compose configuration
        env:
          TLS_MODE: ${{ matrix.tls_mode }}
          ACME_EMAIL: ${{ matrix.tls_mode == 'acme' && 'ci@example.com' || '' }}
          PUBLIC_SCHEME: ${{ matrix.tls_mode == 'acme' && 'https' || 'http' }}
          IMAGE_REPOSITORY: ${{ matrix.image_repository }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: docker compose ${{ matrix.files }} config -q
      # Fixed addresses must lie outside edge_net's dynamic ip_range, or a container can take Traefik's address.
      - name: edge_net addressing (fixed IPs outside the dynamic range)
        env:
          TLS_MODE: ${{ matrix.tls_mode }}
          ACME_EMAIL: ${{ matrix.tls_mode == 'acme' && 'ci@example.com' || '' }}
          PUBLIC_SCHEME: ${{ matrix.tls_mode == 'acme' && 'https' || 'http' }}
          IMAGE_REPOSITORY: ${{ matrix.image_repository }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: scripts/ci/check_edge_net.sh
      - name: Images are named by repository and tag
        if: matrix.image == 'pinned'
        env:
          TLS_MODE: ${{ matrix.tls_mode }}
          IMAGE_REPOSITORY: ${{ matrix.image_repository }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          images="$(docker compose ${{ matrix.files }} --profile tools config --images)"
          echo "$images"
          for svc in api-gateway frontend mcp-logs traefik; do
            grep -qx "${IMAGE_REPOSITORY}/${svc}:${IMAGE_TAG}" <<<"$images" || { echo "missing image for ${svc}" >&2; exit 1; }
          done

  # TLS_MODE has no default on purpose: the guard must still reject a missing value.
  compose-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sed '/^TLS_MODE=/d' .env.example > .env
      - name: TLS_MODE unset must be rejected
        run: |
          if out="$(docker compose config -q 2>&1)"; then
            echo "docker compose config accepted a configuration without TLS_MODE" >&2
            exit 1
          fi
          echo "$out"
          grep -q 'TLS_MODE' <<<"$out" || { echo "rejected, but not because of TLS_MODE" >&2; exit 1; }

  # US-CICD-003: the runner executes workflow code on the host, so its Compose is checked on the RESOLVED model (not
  # on text, which comments and anchors can fool): no Docker socket anywhere, no published ports, not privileged, no
  # host network, no capabilities, read-only root, a single dedicated network, and (US-CICD-004) exactly two host bind
  # mounts: the deploy inbox (rw) and outbox (ro).
  runner-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUNNER_REPO_URL: https://github.com/example/example
      # Host sides of the only two bind mounts (the deploy spool); the Compose refuses to resolve without them.
      DEPLOY_INBOX_DIR: /srv/autoops/deploy/inbox
      DEPLOY_OUTBOX_DIR: /srv/autoops/deploy/outbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml==6.0.3
      - run: docker compose -f infra/runner/docker-compose.yml config -q
      - name: RUNNER_REPO_URL unset must be rejected
        run: |
          if out="$(env -u RUNNER_REPO_URL docker compose -f infra/runner/docker-compose.yml config -q 2>&1)"; then
            echo "the runner Compose accepted a configuration without RUNNER_REPO_URL" >&2
            exit 1
          fi
          grep -q 'RUNNER_REPO_URL' <<<"$out"
      - name: The spool directories are required
        run: |
          for var in DEPLOY_INBOX_DIR DEPLOY_OUTBOX_DIR; do
            if out="$(env -u "$var" docker compose -f infra/runner/docker-compose.yml config -q 2>&1)"; then
              echo "the runner Compose accepted a configuration without ${var}" >&2
              exit 1
            fi
            grep -q "$var" <<<"$out"
          done
      - name: The runner stays locked down
        run: scripts/ci/check_runner_compose.sh infra/runner/docker-compose.yml
      # The guard must really bite: a third mount, a writable outbox, the Docker socket... turn it red.
      - name: The guard rejects a weakened Compose
        run: scripts/ci/test_runner_compose_guard.sh

  # US-CICD-003 AC-4: the repository is public and the self-hosted runner executes whatever a workflow says, so a
  # workflow that targets it may only be triggered by workflow_dispatch / push to main and must declare the
  # `production` environment (limited to main). Parsed as YAML, not grepped, so comments cannot fool it.
  runner-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml==6.0.3
      - run: scripts/ci/check_runner_workflows.sh
      # US-CICD-005: the guard must really bite on deploy.yml (a pull_request trigger, no `production` environment...).
      - name: The guard rejects a weakened workflow
        run: scripts/ci/test_runner_workflows_guard.sh

  # US-CICD-004 AC-2: the host treats the deploy request as untrusted input. The parser (symlinks, size, NUL/CR, unknown or
  # duplicated keys, injection characters) and the provenance checks (tag on main, not older than the current release,
  # images in the registry) are exercised with a fake docker/curl: every rejected request must leave no docker call.
  deploy-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/test_deploy.sh
      - name: Runner side of the handoff (request_deploy.sh)
        run: scripts/ci/test_request_deploy.sh
      # US-CICD-005 AC-2: every check of the post-deploy smoke test turns it red when its own condition breaks.
      - name: Post-deploy smoke test (smoke_test.sh)
        run: scripts/ci/test_smoke.sh
      # Authentication rollout: the production env guard (JWT_SECRET) and the credential-free user creation wrapper.
      - name: Production env guard (validate_env.sh)
        run: scripts/ci/test_validate_env.sh
      - name: User creation wrapper (create_user.sh)
        run: scripts/ci/test_create_user.sh
      - name: edge_net addressing guard (check_edge_net.sh)
        run: scripts/ci/test_edge_net_guard.sh

  # Lints every tracked shell script with the shellcheck preinstalled on the runner (see .shellcheckrc).
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  # Builds the four images exactly as the Compose declares them (contexts, Dockerfiles, build-args), without
  # pushing, so a broken Dockerfile is caught before the merge. Fork pull requests need no token for this.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Frontend image uses the Node version CI tests with
        run: |
          nvmrc="$(tr -d '[:space:]' < apps/frontend/.nvmrc)"
          dockerfile="$(sed -n 's/^ARG NODE_VERSION=//p' apps/frontend/Dockerfile)"
          echo ".nvmrc=${nvmrc} Dockerfile=${dockerfile}"
          [ -n "$dockerfile" ] && [ "${nvmrc%%.*}" = "${dockerfile%%.*}" ] \
            || { echo "apps/frontend/Dockerfile NODE_VERSION differs from .nvmrc" >&2; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: cp .env.example .env
      - name: Build the images
        env:
          TLS_MODE: selfsigned
        run: |
          docker buildx bake -f docker-compose.yml --load \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max' \
            api-gateway frontend mcp-logs traefik
      # Vulnerability scan of the images just built (autoops/<service>:dev). HIGH/CRITICAL with an available fix fail the
      # job; unpatched ones are ignored. Every image is scanned even if a previous one failed (`if: always()`).
      - name: Trivy api-gateway
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: autoops/api-gateway:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-api-gateway.txt
          trivyignores: .trivyignore
      - name: Trivy frontend
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: autoops/frontend:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-frontend.txt
          trivyignores: .trivyignore
      - name: Trivy mcp-logs
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: autoops/mcp-logs:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-mcp-logs.txt
          trivyignores: .trivyignore
      - name: Trivy traefik
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: autoops/traefik:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-traefik.txt
          trivyignores: .trivyignore
      # trivy-action writes the table only to the file when `output` is set: print it to the log too, then to the summary.
      - name: Trivy findings (log and summary)
        if: always()
        run: |
          for svc in api-gateway frontend mcp-logs traefik; do
            echo "::group::Trivy image: ${svc}"
            cat "trivy-${svc}.txt" 2>/dev/null || echo "no report"
            echo "::endgroup::"
            { echo "### Trivy image: ${svc}"; echo '```'; cat "trivy-${svc}.txt" 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      # The self-hosted runner image (US-CICD-003); its own scope keeps its layers apart in the Actions cache.
      - name: Build the runner image
        env:
          RUNNER_REPO_URL: https://github.com/example/example
          # Required by the Compose interpolation (spool bind mounts); bake only builds, nothing is mounted.
          DEPLOY_INBOX_DIR: /srv/autoops/deploy/inbox
          DEPLOY_OUTBOX_DIR: /srv/autoops/deploy/outbox
        # bake resolves `context: .` against the working directory, not the Compose file: run it from its folder.
        working-directory: infra/runner
        run: |
          docker buildx bake -f docker-compose.yml \
            --set '*.cache-from=type=gha,scope=runner' --set '*.cache-to=type=gha,mode=max,scope=runner' runner

  # Static analysis of all Python (backend, AI engine, MCP servers, tests, scripts). Rules live in ruff.toml.
  lint-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.4
      - name: Ruff
        run: ruff check . --output-format github

  # Known-vulnerability audit of the dependencies that ship. Gate: pip-audit has no severity filter, so any advisory
  # that affects a resolved version fails the job (silence a justified one with --ignore-vuln, see infra/ci/README.md);
  # npm audit fails from severity `high` upwards. Both write a readable report to the job summary first.
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.nvmrc
      - run: pip install pip-audit==2.10.1
      # The requirements are version ranges: pip-audit resolves each file and audits what would be installed.
      - name: pip-audit
        run: |
          set -o pipefail   # a failing pip-audit must not be masked by `tee`
          status=0
          for req in apps/api_gateway/requirements.txt services/ai-engine/requirements.txt services/mcp-servers/logs_server/requirements.txt; do
            echo "### pip-audit: \`${req}\`" >> "$GITHUB_STEP_SUMMARY"
            pip-audit -r "$req" --progress-spinner off -f markdown | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"
      - name: npm audit (production dependencies, fails from high)
        working-directory: apps/frontend
        run: |
          { echo "### npm audit: \`apps/frontend\` (omit dev)"; echo '```'; npm audit --omit=dev || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high

  # Misconfiguration scan (Trivy `config`) of every Dockerfile. Trivy does not parse docker-compose files; the Compose
  # is covered by the `compose` jobs. HIGH and CRITICAL fail the job.
  trivy-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy config
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-config.txt
          trivyignores: .trivyignore
      - name: Trivy findings (log and summary)
        if: always()
        run: |
          cat trivy-config.txt 2>/dev/null || echo "no report"
          { echo "### Trivy config (Dockerfiles)"; echo '```'; cat trivy-config.txt 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The only status branch protection requires: it passes when every job in `needs` succeeded.
  # `if: always()` makes it run (and fail) when a needed job failed, was cancelled or skipped.
  ci:
    needs: [backend, frontend, compose, compose-guard, shellcheck, images, runner-compose, runner-workflows, deploy-guards, lint-python, dependency-audit, trivy-config]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null

  # US-CICD-002 AC-3. Publishes the images of a commit that reached main with a green CI: `needs: ci` (a red CI skips
  # it, since an `if` without a status function implies success()) and the event guard keeps pull requests, forks
  # and other branches from ever reaching the registry. The only job with a write token.
  # Tags are the full commit SHA, immutable; there is no `latest`.
  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cp .env.example .env
      # GHCR requires lowercase repository names. The OCI labels trace every image to its commit; `source` also
      # links the package to this repository, which is what lets GITHUB_TOKEN keep pushing to it.
      - name: Build and push the images
        env:
          TLS_MODE: selfsigned
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export IMAGE_REPOSITORY="ghcr.io/${OWNER,,}/autoops"
          docker buildx bake -f docker-compose.yml --push \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max' \
            --set "*.labels.org.opencontainers.image.source=${SOURCE_URL}" \
            --set "*.labels.org.opencontainers.image.revision=${IMAGE_TAG}" \
            --set "*.labels.org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            api-gateway frontend mcp-logs traefik
