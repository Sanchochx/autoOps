# Self-hosted GitHub Actions runner (US-CICD-003). A Compose project of its own, NOT part of the application
# docker-compose.yml: `autoops.service` runs `up --remove-orphans` and `down`, which would remove or stop the runner,
# and a runner failure must never affect the stack. Managed by autoops-runner.service (scripts/provision/75_runner.sh).
#
#   docker compose -f infra/runner/docker-compose.yml --env-file .env up -d
#
# The runner executes workflow code, so it gets the least it can work with: no Docker socket, no Docker client, no host
# mounts except the two deploy spool directories (US-CICD-004), no published ports, no capabilities, a read-only root filesystem and a network with nothing else on it.
# The `runner-compose` job of ci.yml fails if any of that is removed.
name: autoops-runner

services:
  runner:
    image: autoops/runner:local
    # RUNNER_VERSION / RUNNER_SHA256 are optional overrides; without them the Dockerfile pin applies.
    build:
      context: .
      args:
        - RUNNER_VERSION
        - RUNNER_SHA256
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: ${RUNNER_PIDS_LIMIT:-512}
    mem_limit: ${RUNNER_MEMORY_LIMIT:-2g}
    cpus: ${RUNNER_CPUS:-2}
    environment:
      RUNNER_REPO_URL: ${RUNNER_REPO_URL:?define RUNNER_REPO_URL in .env}
      RUNNER_LABELS: ${RUNNER_LABELS:-autoops-prod}
      RUNNER_NAME: ${RUNNER_NAME:-autoops-runner}
      # Inside the container the token is always at the secret path (see `secrets` below).
      RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/runner_token
      # The root filesystem is read-only: tools that want a home write to the tmpfs.
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      DOTNET_NOLOGO: "1"
      # Graceful shutdown: without it run.sh has no signal trap, SIGTERM kills the bash script and orphans the
      # listener, which Docker then SIGKILLs without deleting its GitHub session (next start: "A session for this
      # runner already exists", Conflict, for ~3 min). With it run.sh forwards INT to the listener, which closes the session.
      RUNNER_MANUALLY_TRAP_SIG: "1"
      # Where the jobs find the deploy spool (scripts/ci/request_deploy.sh); the container paths are fixed.
      DEPLOY_INBOX_DIR: /deploy/inbox
      DEPLOY_OUTBOX_DIR: /deploy/outbox
    secrets: [runner_token]
    volumes:
      # Working copy of the runner and its credentials (.runner, .credentials*): survives restarts.
      - runner_home:/home/runner/runner
      # The ONLY two host mounts (US-CICD-004): the runner asks for a deploy by writing `request` into the inbox and
      # reads the outcome from the outbox (read-only: it cannot forge a status). The sources are the host spool
      # directories created by 70_systemd.sh; they must already exist (create_host_path: false), so Docker never
      # creates them as root. The `runner-compose` CI job fails on a third mount, a writable outbox or any other source.
      - type: bind
        source: ${DEPLOY_INBOX_DIR:?define DEPLOY_INBOX_DIR (host spool, see .env.example)}
        target: /deploy/inbox
        bind: {create_host_path: false}
      - type: bind
        source: ${DEPLOY_OUTBOX_DIR:?define DEPLOY_OUTBOX_DIR (host spool, see .env.example)}
        target: /deploy/outbox
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      # Every job starts from an empty workspace, and nothing a job writes survives a restart.
      - /tmp:mode=1777,size=512m
      - /home/runner/runner/_work:uid=10001,gid=10001,mode=0700,size=${RUNNER_WORKSPACE_SIZE:-2g}
      - /home/runner/runner/_diag:uid=10001,gid=10001,mode=0700,size=64m
    networks: [runner_net]

# Only needed on first start (registration); afterwards the runner uses its own credentials from the volume.
# Unset = /dev/null, which the entrypoint reports as an empty token. The file must be readable by UID 10001.
secrets:
  runner_token:
    file: ${RUNNER_REGISTRATION_TOKEN_FILE:-/dev/null}

volumes:
  runner_home:

# Internet egress (GitHub); shares nothing with edge_net, backend_net or mcp_net of the application.
networks:
  runner_net:
